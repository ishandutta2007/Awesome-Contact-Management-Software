<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#primaryTextGrad);
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 13px;
      fill: #e2e8f0;
    }
    
    /* Dynamic Background Animations (Strictly in Background) */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.12); }
    }
    @keyframes orbitFloat {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes streamLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .pulsing-orb-1 {
      transform-origin: 200px 100px;
      animation: pulseGlow 7s ease-in-out infinite;
    }
    .pulsing-orb-2 {
      transform-origin: 1000px 320px;
      animation: pulseGlow 9s ease-in-out infinite reverse;
    }
    .floating-card-1 {
      animation: orbitFloat 6s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: orbitFloat 8s ease-in-out infinite 1s;
    }
    .conn-line {
      stroke-dasharray: 8 8;
      animation: streamLine 20s linear infinite;
    }
  </style>

  <!-- Deep Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Animated Ambient Nebula Orbs (in Background) -->
  <g class="pulsing-orb-1" filter="url(#softGlow)">
    <circle cx="220" cy="120" r="130" fill="#0284c7" opacity="0.4" />
  </g>
  <g class="pulsing-orb-2" filter="url(#softGlow)">
    <circle cx="980" cy="300" r="160" fill="#7c3aed" opacity="0.3" />
  </g>

  <!-- Dynamic Relationship Network Constellation (Background Graphics) -->
  <g opacity="0.35">
    <path class="conn-line" d="M 120 80 Q 300 240 500 120 T 900 160 T 1120 280" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path class="conn-line" d="M 80 320 Q 350 200 650 340 T 1050 140" fill="none" stroke="#818cf8" stroke-width="1.5" />
    
    <!-- Network nodes -->
    <circle cx="120" cy="80" r="4" fill="#38bdf8" />
    <circle cx="500" cy="120" r="5" fill="#818cf8" />
    <circle cx="900" cy="160" r="4" fill="#c084fc" />
    <circle cx="1120" cy="280" r="5" fill="#38bdf8" />
    <circle cx="80" cy="320" r="4" fill="#818cf8" />
    <circle cx="650" cy="340" r="5" fill="#38bdf8" />
  </g>

  <!-- Ambient Dynamic Floating Contact Cards (in Background / Flanks) -->
  <g class="floating-card-1" opacity="0.45">
    <rect x="70" y="160" width="160" height="70" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="100" cy="195" r="14" fill="#0284c7" opacity="0.7" />
    <rect x="125" y="185" width="80" height="7" rx="3.5" fill="#94a3b8" />
    <rect x="125" y="198" width="55" height="5" rx="2.5" fill="#64748b" />
  </g>

  <g class="floating-card-2" opacity="0.45">
    <rect x="970" y="110" width="160" height="70" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="1000" cy="145" r="14" fill="#9333ea" opacity="0.7" />
    <rect x="1025" y="135" width="80" height="7" rx="3.5" fill="#94a3b8" />
    <rect x="1025" y="148" width="55" height="5" rx="2.5" fill="#64748b" />
  </g>

  <!-- FOREGROUND LAYER: Title, Subtitle, Badges & Focus Elements (Guaranteed Visible) -->
  <g id="foreground-content">
    <!-- Tagline Badge -->
    <g transform="translate(600, 95)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />
      <circle cx="-115" cy="0" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="10" y="5" text-anchor="middle" class="tagline">Awesome Curated Directory</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="170" text-anchor="middle" class="title">Awesome Contact Management</text>

    <!-- Subtitle -->
    <text x="600" y="215" text-anchor="middle" class="subtitle">The definitive index of Modern SaaS Platforms &amp; Self-Hosted Open-Source CRMs</text>

    <!-- Feature Pills / Highlights in Foreground -->
    <g transform="translate(600, 275)">
      <!-- Pill 1: Personal CRM -->
      <g transform="translate(-330, 0)">
        <rect x="-70" y="-18" width="140" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" class="pill-text">👥 Personal CRM</text>
      </g>

      <!-- Pill 2: Relationship Intelligence -->
      <g transform="translate(-150, 0)">
        <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" class="pill-text">⚡ Relationship Intel</text>
      </g>

      <!-- Pill 3: Self-Hosted & CardDAV -->
      <g transform="translate(60, 0)">
        <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" class="pill-text">🔒 Self-Hosted &amp; Open</text>
      </g>

      <!-- Pill 4: AI & Omnichannel -->
      <g transform="translate(265, 0)">
        <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" class="pill-text">🤖 Address Book Sync</text>
      </g>
    </g>

    <!-- Bottom Accent Border Glow -->
    <line x1="250" y1="365" x2="950" y2="365" stroke="url(#primaryTextGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>
